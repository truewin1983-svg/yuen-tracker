<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="昱恩追蹤">
<meta name="theme-color" content="#16233a">
<link rel="manifest" href="manifest.json">
<title>昱恩-內部追蹤工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1b2333; --muted:#7c8493; --line:#e8ebef;
  --ink-soft:#5a6373; --accent:#2f6f6a; --accent-soft:#e4f0ef;
  --blue:#1f6feb; --blue-bg:#e7f0fd; --amber:#b4670b; --amber-bg:#fbf0dc;
  --green:#1f7a37; --green-bg:#e6f3e8; --red:#a5371d; --red-bg:#fbe9e4; --purple:#5b4bc4; --purple-bg:#ecebfb;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,50,.04),0 4px 16px rgba(20,30,50,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit}

/* ---------- top bar ---------- */
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;
  position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-ok{background:var(--green)}.dot-err{background:var(--red)}.dot-loading{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- tab strip ---------- */
.tabwrap{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:55}
.tabs{display:flex;gap:2px;max-width:1120px;margin:0 auto;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;font-size:13.5px;color:var(--muted);background:none;border:none;cursor:pointer;
  border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:500;flex-shrink:0}
.tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tab:hover:not(.active){color:var(--ink-soft)}

.container{max-width:1120px;margin:0 auto;padding:16px 14px calc(28px + var(--safe-b))}
.section{display:none;animation:fade .2s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{padding:8px 14px;font-size:13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  cursor:pointer;color:var(--ink);font-weight:500;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f0f2f5}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-primary:hover{background:#2a3650}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:#eef0f3;color:var(--ink)}
.btn-danger{color:var(--red);border-color:#f0cfc6;background:var(--panel)}
.btn-danger:hover{background:var(--red-bg)}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:560px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:5px}
.stat-value{font-size:24px;font-weight:700;line-height:1}

/* ---------- toolbar / filters ---------- */
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.filters input{flex:1;min-width:130px}
.field-icon{position:relative;flex:1;min-width:140px;display:flex}
.field-icon input{width:100%}

/* ---------- responsive task list (table on desktop, cards on mobile) ---------- */
.tlist{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.thead,.trow{display:grid;grid-template-columns:1.7fr .9fr .8fr .8fr .6fr .9fr .9fr 1.6fr 56px 40px;align-items:center;gap:8px}
.thead{padding:10px 14px;background:#fafbfc;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:600}
.trow{padding:9px 14px;border-bottom:1px solid #f1f3f5;font-size:13px}
.trow:last-child{border-bottom:none}
.trow:hover{background:#fafbfc}
.trow.done{opacity:.55;background:#fafbfc}
.trow.done .t-title-input{text-decoration:line-through;color:var(--muted)}
.cell-label{display:none}
.inp{border:1px solid transparent;background:transparent;font-size:13px;color:inherit;width:100%;padding:5px 7px;border-radius:8px;font-family:inherit}
.inp:hover{background:#eef0f3}
.inp:focus{outline:none;border-color:var(--ink);background:#fff}
.sel{border:1px solid transparent;background:transparent;font-size:12.5px;cursor:pointer;padding:5px 6px;border-radius:8px;color:inherit;width:100%}
.sel:hover{background:#eef0f3}
.sel:focus{outline:none;border-color:var(--ink);background:#fff}
.x-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px;border-radius:7px;line-height:1}
.x-btn:hover{background:var(--red-bg);color:var(--red)}

.badge{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-purple{background:var(--purple-bg);color:var(--purple)}
.b-cat{background:#eef0f3;color:var(--ink-soft);max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 優先度：看起來還是原本的色塊，但其實是可以直接改的下拉 */
.pri-sel{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid transparent;
  cursor:pointer;width:auto;font-family:inherit;appearance:none;-webkit-appearance:none;text-align:center}
.pri-sel:hover{border-color:currentColor}
.pri-sel:focus{outline:2px solid var(--brand,#3b6ef0);outline-offset:1px}
.person{display:flex;align-items:center;gap:6px;min-width:0}
.exec-cell{cursor:pointer;border-radius:8px;padding:3px 5px;margin:-3px -5px}
.exec-cell:hover{background:#eef0f3}
.persons{display:flex;flex-wrap:wrap;gap:4px 8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
      background:#fff;cursor:pointer;user-select:none;white-space:nowrap}
.chip.on{background:#111;color:#fff;border-color:#111}
.person span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.hist-btn{font-size:11.5px;padding:4px 9px;color:var(--purple);border:1px solid #d8d4f5;border-radius:8px;background:var(--purple-bg);cursor:pointer;white-space:nowrap}
.hist-btn:hover{background:#e0ddf7}

@media(max-width:860px){
  .thead{display:none}
  .tlist{background:transparent;border:none;box-shadow:none;display:flex;flex-direction:column;gap:10px}
  .trow{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;box-shadow:var(--shadow);position:relative}
  .trow>div{margin-bottom:2px}
  .trow .cell{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed #f0f2f5}
  .trow .cell:last-child{border-bottom:none}
  .cell-label{display:inline-block;font-size:11.5px;color:var(--muted);width:64px;flex-shrink:0;font-weight:500}
  .cell-title{margin-bottom:6px}
  .cell-title .inp{font-size:15px;font-weight:600;padding:2px 4px}
  .trow .x-btn{position:absolute;top:10px;right:10px}
  .inp:hover,.sel:hover{background:#eef0f3}
}

/* ---------- generic cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:700}
.card-date{font-size:12px;color:var(--muted);margin-top:2px}
.card-summary{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.6;white-space:pre-wrap}
.doc-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue);text-decoration:none;
  padding:6px 11px;border:1px solid #c4dbfb;border-radius:9px;background:var(--blue-bg);white-space:nowrap;font-weight:500}
.doc-link:hover{background:#d6e6fc}
.action-item{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #f1f3f5;font-size:13px}
.action-item:last-child{border-bottom:none}
.check{width:18px;height:18px;border:1.5px solid #cdd3db;border-radius:5px;flex-shrink:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;transition:.12s}
.check.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- 卡片 ---------- */
.cal-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-month{font-size:18px;font-weight:700;min-width:130px;text-align:center}
.cal-grid{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dowrow{background:#fafbfc;border-bottom:1px solid var(--line)}
.cal-dow{text-align:center;padding:9px 0;font-size:12px;color:var(--muted);font-weight:600}
.cal-dow:first-child,.cal-dow:last-child{color:var(--red)}
.cal-cell{min-height:96px;border-right:1px solid #f1f3f5;border-bottom:1px solid #f1f3f5;padding:6px 6px;cursor:pointer;position:relative;transition:.1s}
.cal-cell:hover{background:#fafbfc}
.cal-cell.other{background:#fcfcfd}
.cal-cell.other .cal-num{color:#c4cad3}
.cal-num{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%}
.cal-cell.today .cal-num{background:var(--ink);color:#fff}
.cal-ev{font-size:11px;padding:2px 6px;border-radius:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:pointer}
.cal-more{font-size:10.5px;color:var(--muted);margin-top:2px;padding-left:2px}
@media(max-width:640px){
  .cal-cell{min-height:64px;padding:4px 3px}
  .cal-num{width:20px;height:20px;font-size:11px}
  .cal-ev{font-size:9.5px;padding:1px 4px}
  .cal-dow{font-size:11px;padding:7px 0}
}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- empty / loading ---------- */
.empty,.loading{font-size:13px;color:var(--muted);text-align:center;padding:36px 0}

/* ---------- modal ---------- */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,22,38,.45);z-index:100;
  align-items:flex-start;justify-content:center;padding:20px 14px calc(20px + var(--safe-b));overflow-y:auto;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border-radius:18px;padding:20px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(15,22,38,.25);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px}
.row{margin-bottom:13px}
.row label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500}
.row input,.row select,.row textarea{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);outline:none}
.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row textarea{resize:vertical;min-height:70px;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}
.toggle{display:flex;align-items:center;gap:10px;background:#f6f7f9;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.toggle-info{flex:1}
.toggle-info b{font-size:13.5px;display:block}
.toggle-info small{font-size:11.5px;color:var(--muted)}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cdd3db;border-radius:99px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(18px)}

.history-box{max-height:280px;overflow-y:auto;margin-bottom:13px}
.history-item{padding:9px 0;border-bottom:1px solid #f1f3f5;font-size:13px}
.history-item:last-child{border-bottom:none}
.history-item .d{color:var(--muted);font-size:11px;margin-bottom:2px}

.hint{font-size:12px;color:var(--ink-soft);background:#f6f7f9;border:1px solid var(--line);border-radius:11px;padding:11px 13px;line-height:1.6;margin-bottom:13px}
.hint b{color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(22px + var(--safe-b));
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;
  opacity:0;transition:.25s;pointer-events:none;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.pill-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.tg-table{width:100%;border-collapse:collapse}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="logo">昱</span>昱恩 · 內部追蹤</div>
  <div class="sync"><span class="dot dot-loading" id="dot"></span><span id="sync-text">連線中…</span></div>
</div>

<div class="tabwrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="list" onclick="switchTab('list',this)">任務清單</button>
    <button class="tab" data-tab="members" onclick="switchTab('members',this)">成員 · LINE</button>
  </div>
</div>

<div class="container">

  <!-- ====== TASKS ====== -->
  <div id="tab-list" class="section active">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">全部任務</div><div class="stat-value" id="s-total">–</div></div>
      <div class="stat-card"><div class="stat-label">進行中</div><div class="stat-value" style="color:var(--amber)" id="s-doing">–</div></div>
      <div class="stat-card"><div class="stat-label">待處理</div><div class="stat-value" style="color:var(--blue)" id="s-todo">–</div></div>
      <div class="stat-card"><div class="stat-label">已完成</div><div class="stat-value" style="color:var(--green)" id="s-done">–</div></div>
    </div>
    <div class="toolbar">
      <div style="font-size:15px;font-weight:700">任務清單</div>
      <div class="toolbar-actions">
        <button class="btn btn-sm" onclick="loadData()">↻ 重新整理</button>
        <button class="btn btn-sm btn-primary" onclick="openModal('task')">+ 新任務</button>
      </div>
    </div>
    <div class="filters">
      <div class="field-icon"><input id="search" placeholder="🔍 搜尋任務…" oninput="renderList()"></div>
      <select id="f-member" onchange="renderList()"><option value="">全部成員</option></select>
      <select id="f-cat" onchange="renderList()"><option value="">全部專案</option></select>
      <select id="f-pri" onchange="renderList()"><option value="">全部優先度</option><option>高</option><option>中</option><option>低</option></select>
      <select id="f-parent" onchange="renderList()"><option value="">全部主任務</option></select>
      <select id="f-status" onchange="renderList()"><option value="">全部狀態</option><option>待處理</option><option>進行中</option><option>完成</option><option>取消/終止</option></select>
      <select id="f-sort" onchange="renderList()"><option value="due_desc">截止日：新→舊</option><option value="due_asc">截止日：舊→新（快到期優先）</option><option value="new">最近新增</option></select>
    </div>
    <div class="tlist">
      <div class="thead">
        <div>任務名稱</div><div>專案</div><div>負責人</div><div>協助者</div><div>優先</div>
        <div>狀態</div><div>截止</div><div>備註／進度</div><div>歷史</div><div></div>
      </div>
      <div id="task-body"><div class="loading">載入中…</div></div>
    </div>
  </div>

  <!-- ====== TARGETS ====== -->

  <!-- ====== ANALYTICS ====== -->
  <!-- ====== MEMBERS ====== -->
  <div id="tab-members" class="section">
    <div class="toolbar"><div style="font-size:15px;font-weight:700">成員 · LINE 通知設定</div>
      <button class="btn btn-sm btn-primary" onclick="openModal('member')">+ 新增成員</button></div>
    <div class="hint" id="bind-hint"></div>
    <div id="members-body"><div class="loading">載入中…</div></div>
  </div>

</div>

<!-- ============ MODALS ============ -->
<div class="modal-bg" id="modal-task"><div class="modal">
  <h3>新增任務</h3>
  <div class="row"><label>任務名稱</label><input id="t-title" placeholder="請輸入任務名稱"></div>
  <div class="row2">
    <div class="row"><label>專案分類</label><input id="t-category" list="dl-cat" placeholder="選擇或輸入"><datalist id="dl-cat"></datalist></div>
    <div class="row"><label>負責人</label><input id="t-member" list="dl-people" placeholder="擔當者"><datalist id="dl-people"></datalist></div>
  </div>
  <div class="row"><label>協助者 <small style="font-weight:400;color:var(--muted)">（可複選，點名字加入／移除）</small></label>
    <input id="t-executor" list="dl-people" placeholder="點下方名字，或自行輸入（用頓號分隔）">
    <div id="t-exec-chips" class="chips"></div>
  </div>
  <div class="row2">
    <div class="row"><label>優先度</label><select id="t-priority"><option>高</option><option selected>中</option><option>低</option></select></div>
    <div class="row"><label>狀態</label><select id="t-status"><option>待處理</option><option>進行中</option><option>完成</option><option>取消/終止</option></select></div>
  </div>
  <div class="row2">
    <div class="row"><label>截止日期</label><input id="t-due" type="date"></div>
    <div class="row"><label>上層任務 <small style="font-weight:400;color:var(--muted)">（只列已勾選為主任務的）</small></label>
      <select id="t-parent"></select></div>
  </div>
  <div class="row">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:400">
      <input type="checkbox" id="t-isparent" style="width:auto">
      <span>把這筆設為<b>主任務</b>（之後其他任務才能掛在它底下）</span></label>
  </div>

<style>
  /* ⚠️ 不要用 margin-left 縮排整列。
     .trow 是 grid，整列位移會讓子任務的欄位跟主任務對不齊，看起來就是一團亂。

  /* 正在篩某一組時，上方下拉給個明顯的顏色，不然使用者會忘記自己開著篩選 */
  #f-parent:not([data-all]){border-color:#2f5fa8;color:#2f5fa8;font-weight:700}
</style>
<script>
/* ===== CONFIG : 你的 Google Apps Script Web App 網址 ===== */
const API='/api/track';   // 改用 Neon（原本是 Google Apps Script，載入要數十秒）

/* ── API 通行碼 ────────────────────────────────────────
   ⚠️ 密鑰不能寫死在這裡。這是公開的靜態網頁，任何人按 F12 就看得到，
      寫進來等於沒鎖。改成第一次使用時請本人輸入，存在自己的瀏覽器 localStorage。
   ⚠️ 伺服器端要等 api/track.js 也改好才會真的檢查；
      在那之前這個 header 送過去只是被忽略，功能完全不受影響。 */
const KEY_STORE = 'yuen_track_key';
function trackKey(){
  let k = localStorage.getItem(KEY_STORE);
  if(!k){
    k = (prompt('請輸入追蹤工具通行碼') || '').trim();
    if(k) localStorage.setItem(KEY_STORE, k);
  }
  return k || '';
}
// 打錯的話要能清掉重問，否則會一直卡在同一組錯的通行碼上
function clearTrackKey(){ localStorage.removeItem(KEY_STORE); }
// 伺服器回 401 時自動清掉並重新整理，使用者不必知道 localStorage 是什麼
function onAuthFail(){
  clearTrackKey();
  alert('通行碼不正確，請重新輸入。');
  location.reload();
}

/* ===== state ===== */
let tasks=[],histories=[],members=[];
let currentTab='list',pendingDelete=null,curHistoryId=null,saveTimer={};
const COLORS=['#1f6feb','#1f7a37','#a5371d','#5b4bc4','#0f766e','#b4670b'];
const MC={};let ci=0;
const EVENT_COLORS={'開幕':'#b4327a','休假':'#b4670b','上市':'#1f7a37','活動':'#1f6feb','提醒':'#a5371d','其他':'#5b6573'};
const EVENT_BG={'開幕':'#fbe4f1','休假':'#fbf0dc','上市':'#e6f3e8','活動':'#e7f0fd','提醒':'#fbe9e4','其他':'#eef0f3'};

/* ===== helpers ===== */
function mc(n){if(!n)return'#7c8493';if(!MC[n])MC[n]=COLORS[ci++%COLORS.length];return MC[n];}
/* 協助者可以多位，資料庫存成「阿翔、品妤」這種字串 */
const SEP=/[、,，;；\/]+/;
function people2arr(v){ return String(v||'').split(SEP).map(x=>x.trim()).filter(Boolean); }
function arr2people(a){ return [...new Set(a)].join('、'); }
function hasPerson(v,name){ return people2arr(v).includes(name); }

function avatar(n){if(!n)return'';const c=mc(n);return`<span class="avatar" style="background:${c}1f;color:${c}">${n[0]}</span>`;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function jsAttr(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function priBadge(p){const m={'高':'b-red','中':'b-amber','低':'b-green'};return`<span class="badge ${m[p]||'b-amber'}">${p||'中'}</span>`;}
/* 優先度：外觀維持原本的色塊，但改成 select，點下去就能直接換 */
const PRI_CLASS={'高':'b-red','中':'b-amber','低':'b-green'};
function priSelect(t){
  const cur=t.priority||'中', cls=PRI_CLASS[cur]||'b-amber', id=jsAttr(t.id);
  return `<select class="sel pri-sel ${cls}" onchange="inlineUpdate('${id}','priority',this.value)">`
    + ['高','中','低'].map(p=>`<option${p===cur?' selected':''}>${p}</option>`).join('')
    + `</select>`;
}
function fmtDate(d){if(!d)return'';const s=String(d);if(s.includes('T')){const dt=new Date(s);if(!isNaN(dt))return dt.getFullYear()+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getDate()).padStart(2,'0');}return s.slice(0,10).replace(/-/g,'/');}
function toISO(d){if(!d)return'';const s=String(d);if(s.includes('T')){const dt=new Date(s);if(!isNaN(dt))return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}return s.slice(0,10).replace(/\//g,'-');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function setStatus(m,s){document.getElementById('sync-text').textContent=m;document.getElementById('dot').className='dot '+(s==='ok'?'dot-ok':s==='err'?'dot-err':'dot-loading');}

/* ===== API ===== */
// 讀取：直接打自家 API（Neon），不再需要 JSONP
async function apiGet(action){
  const r=await fetch(API+'?action='+encodeURIComponent(action),
    {cache:'no-store', headers:{'x-track-key': trackKey()}});
  if(r.status===401){ onAuthFail(); throw new Error('通行碼不正確'); }
  const j=await r.json();
  if(j&&j.error)throw new Error(j.error);
  return j;
}

const NO_RETRY_ACTIONS = new Set(['addTask','addMember','addTarget',
  'addHistory']);

async function apiPost(body,retries){
  const isCreate = body && NO_RETRY_ACTIONS.has(body.action);
  retries = (retries!=null) ? retries : (isCreate ? 0 : 2);
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{
      const r=await fetch(API,{method:'POST',body:JSON.stringify(body),
        headers:{'Content-Type':'application/json','x-track-key': trackKey()}});
      // 401 不要重試——重試幾次結果都一樣，只是拖慢畫面
      if(r.status===401){ onAuthFail(); throw new Error('通行碼不正確'); }
      const j=await r.json();
      if(j&&j.error)throw new Error(j.error);
      return j;
    }catch(e){lastErr=e;if(i<retries)await new Promise(res=>setTimeout(res,600*(i+1)));}
  }
  throw lastErr;
}

/* ===== load ===== */
async function loadData(){
  setStatus('同步中…','loading');
  try{
    const d=await apiGet('all');            // 一次取回全部，只發一個請求
    tasks=arr(d.tasks); histories=arr(d.histories);
    members=arr(d.members);
    updateStats();updateFilters();renderCurrent();
    const tm=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    setStatus('已同步 · '+tm,'ok');
  }catch(e){
    setStatus('連線失敗，點重新整理','err');
  }
}
function arr(x){return Array.isArray(x)?x:[];}

function updateStats(){
  document.getElementById('s-total').textContent=tasks.length;
  document.getElementById('s-doing').textContent=tasks.filter(t=>t.status==='進行中').length;
  document.getElementById('s-todo').textContent=tasks.filter(t=>t.status==='待處理').length;
  document.getElementById('s-done').textContent=tasks.filter(t=>t.status==='完成').length;
}
function updateFilters(){
  const people=[...new Set([
    ...tasks.map(t=>t.member),
    ...tasks.flatMap(t=>people2arr(t.executor)),
    ...members.map(m=>m.name)
  ].filter(Boolean))];
  drawExecChips(people);
  const cats=[...new Set(tasks.map(t=>t.category).filter(Boolean))];
  const mSel=document.getElementById('f-member');const cm=mSel.value;
  mSel.innerHTML='<option value="">全部成員</option>'+people.map(p=>`<option${p===cm?' selected':''}>${esc(p)}</option>`).join('');
  const cSel=document.getElementById('f-cat');const cc=cSel.value;
  cSel.innerHTML='<option value="">全部專案</option>'+cats.map(c=>`<option${c===cc?' selected':''}>${esc(c)}</option>`).join('');
  /* 主任務篩選：只列「勾選為主任務」或「底下真的有子任務」的。
     全部頂層任務都列出來會有幾百筆，找不到。 */
  const pSel=document.getElementById('f-parent'); const cp=pSel.value;
  const parents=tasks.filter(t=>!t.parentTaskId && (truthy(t.isParent)||kidsOf(t.id).length));
  pSel.innerHTML='<option value="">全部主任務</option>'
    +parents.map(p=>`<option value="${jsAttr(p.id)}"${String(p.id)===String(cp)?' selected':''}>${esc(p.title)}（${kidsOf(p.id).length}）</option>`).join('');
  // 選單重畫後原本選的主任務如果消失了（例如被刪或取消勾選），要清掉避免篩出空白
  if(cp && !parents.some(p=>String(p.id)===String(cp))) pSel.value='';
  pSel.toggleAttribute('data-all', !pSel.value);
  document.getElementById('dl-cat').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  document.getElementById('dl-people').innerHTML=people.map(p=>`<option value="${esc(p)}">`).join('');
}

/* ===== tab switch ===== */
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');document.getElementById('tab-'+name).classList.add('active');
  currentTab=name;renderCurrent();
}
function renderCurrent(){
  ({list:renderList,
    members:renderMembers}[currentTab]||(()=>{}))();
}

/* ===== 主任務 / 子任務 ===== */
/* 誰可以出現在「上層任務」選單：只列有勾選「設為主任務」的。
   大多數任務沒有父子關係，全部列出來會有幾百筆，根本找不到。
   已經有子任務的也一併列入，避免旗標被改掉之後既有關係動不了。 */
const isClosed = t => t.status==='完成' || t.status==='取消/終止';
const kidsOf   = id => tasks.filter(t=>String(t.parentTaskId)===String(id));
const truthy   = v => v===true||v==='true'||v==='TRUE'||v===1||v==='1';
function parentOptions(selfId){
  return tasks.filter(t =>
    String(t.id)!==String(selfId) && !t.parentTaskId && !isClosed(t)
    && (truthy(t.isParent) || kidsOf(t.id).length));
}

/* 任務名稱旁邊的小標記。
   點標記本身＝篩選出這一整組（主任務＋所有子任務），這是最常用的動作。
   設定主子關係移到旁邊那顆齒輪，避免兩個功能搶同一次點擊。 */
function hierChip(t, nKids){
  const id=jsAttr(t.id);
  const gear=`<button class="hier-set" onclick="event.stopPropagation();openHier('${id}')"
                title="設定主子關係">⚙</button>`;
  if(t.parentTaskId){
    const p=tasks.find(x=>String(x.id)===String(t.parentTaskId));
    return `<button class="hier c" onclick="filterTree('${jsAttr(t.parentTaskId)}')"
      title="只看這一組">↳ ${esc((p&&p.title)||'上層任務')}</button>${gear}`;
  }
  if(truthy(t.isParent) || nKids)
    return `<button class="hier p" onclick="filterTree('${id}')"
      title="只看這一組">主${nKids?' ▼'+nKids:''}</button>${gear}`;
  return `<button class="hier n" onclick="openHier('${id}')" title="設定主子關係">⋯</button>`;
}

/* 點標記＝把上方那個「主任務」下拉設成它。
   刻意不做成獨立的篩選狀態——共用同一個下拉，畫面才只有一個真相，
   使用者也知道要去哪裡取消。 */
function filterTree(parentId){
  const sel=document.getElementById('f-parent');
  if(!sel) return;
  if(String(sel.value)===String(parentId)){ sel.value=''; showToast('已顯示全部'); }
  else if([...sel.options].some(o=>o.value===String(parentId))){
    sel.value=String(parentId);
    const t=tasks.find(x=>String(x.id)===String(parentId));
    showToast('只看：'+((t&&t.title)||'這一組'));
  } else { showToast('這筆還不是主任務'); return; }
  renderList();
  // 捲到篩選列讓使用者知道狀態變了。這是錦上添花，不能因為它失敗就中斷
  try{ sel.scrollIntoView({block:'nearest'}); }catch(e){}
}

let hierId=null;
function openHier(id){
  const t=tasks.find(x=>String(x.id)===String(id)); if(!t) return;
  hierId=id;
  const nk=kidsOf(id).length;
  document.getElementById('hier-title').textContent=t.title;
  const cb=document.getElementById('h-isparent');
  cb.checked=truthy(t.isParent)||nk>0;
  // 底下已經有子任務就不能取消勾選，否則那些子任務會變成孤兒關係
  cb.disabled = nk>0;
  document.getElementById('h-parent-note').textContent =
    nk>0 ? `底下已有 ${nk} 個子任務，無法取消` : '勾了才會出現在其他任務的「上層任務」選單裡';

  const sel=document.getElementById('h-parent');
  const opts=parentOptions(id);
  const canBeChild = nk===0;
  sel.disabled=!canBeChild;
  sel.innerHTML='<option value="">— 無（這是主任務）—</option>'
    + opts.map(p=>`<option value="${jsAttr(p.id)}"${String(t.parentTaskId)===String(p.id)?' selected':''}>${esc(p.title)}</option>`).join('');
  document.getElementById('h-child-note').textContent = canBeChild
    ? (opts.length ? '' : '目前沒有任何主任務。先把某筆任務勾選為主任務。')
    : '底下已有子任務，不能再掛到別人底下（只支援兩層）';
  openModal('hier');
}
async function saveHier(){
  if(!hierId) return;
  const t=tasks.find(x=>String(x.id)===String(hierId));
  const row={};
  const wantP=document.getElementById('h-isparent').checked;
  const wantC=document.getElementById('h-parent').value||null;
  if(truthy(t.isParent)!==wantP) row.isParent=wantP;
  if(String(t.parentTaskId||'')!==String(wantC||'')) row.parentTaskId=wantC;
  if(!Object.keys(row).length){ closeModal('hier'); return; }
  try{
    await apiPost({action:'updateTask', id:hierId, row});
    if('isParent' in row) t.isParent=row.isParent;
    if('parentTaskId' in row) t.parentTaskId=row.parentTaskId;
    closeModal('hier'); showToast('已儲存'); renderCurrent();
  }catch(e){ showToast('儲存失敗：'+(e.message||'請稍後再試')); await loadData(); }
}
function fillParentPicker(){
  const sel=document.getElementById('t-parent'); if(!sel) return;
  const keep=sel.value, opts=parentOptions(null);
  sel.innerHTML='<option value="">— 無（此為主任務）—</option>'
    + opts.map(p=>`<option value="${jsAttr(p.id)}">${esc(p.title)}</option>`).join('');
  if([...sel.options].some(o=>o.value===keep)) sel.value=keep;
}

/* ===== TASK list ===== */
function getFiltered(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const fm=document.getElementById('f-member').value,fc=document.getElementById('f-cat').value;
  const fp=document.getElementById('f-pri').value,fs=document.getElementById('f-status').value;
  /* 選了主任務時，主任務本身也要留著——只看子任務會看不出整體進度。
     這個條件跟其他篩選是「且」的關係，可以疊加使用
     （例如：惠芬 ＋ 管理部作業流程優化 ＋ 待處理）。 */
  const pSelEl=document.getElementById('f-parent');
  const fpar=(pSelEl||{}).value||'';
  if(pSelEl) pSelEl.toggleAttribute('data-all', !fpar);   // 有沒有在篩，顏色要看得出來
  const inTree=t=>!fpar||String(t.id)===String(fpar)||String(t.parentTaskId)===String(fpar);
  const out=tasks.filter(t=>inTree(t)
    &&(!q||(t.title||'').toLowerCase().includes(q)||(t.note||'').toLowerCase().includes(q))
    &&(!fm||t.member===fm||hasPerson(t.executor,fm))&&(!fc||t.category===fc)&&(!fp||t.priority===fp)&&(!fs||t.status===fs));

  // 排序：未結案的永遠排在前面，結案的（完成／取消）沉到最下面
  const sortBy=(document.getElementById('f-sort')||{}).value||'due_desc';
  const closed=t=>(t.status==='完成'||t.status==='取消/終止')?1:0;
  const dnum=t=>{const d=toISO(t.due); return d?Number(d.replace(/-/g,'')):null;};
  out.sort((a,b)=>{
    const c=closed(a)-closed(b); if(c) return c;          // 未結案優先
    if(sortBy==='new') return Number(b.id)-Number(a.id);   // 編號越大＝越晚建立
    const da=dnum(a), db=dnum(b);
    if(da===null&&db===null) return Number(b.id)-Number(a.id);
    if(da===null) return 1;                                // 沒填截止日的排最後
    if(db===null) return -1;
    return sortBy==='due_asc' ? da-db : db-da;
  });
  return out;
}
function histOf(id){return histories.filter(h=>String(h.taskId)===String(id));}
function renderList(){
  const f0=getFiltered(),b=document.getElementById('task-body');
  if(!f0.length){b.innerHTML='<div class="empty">沒有符合的任務</div>';return;}
  /* 把子任務排到自己的主任務底下。
     只重排順序，不動原本的篩選與排序邏輯——主任務之間的順序照舊。
     主任務被篩掉時，子任務維持原位單獨顯示，不會憑空消失。 */
  const shown=new Set(f0.map(t=>String(t.id)));
  const f=[];
  f0.forEach(t=>{
    if(t.parentTaskId && shown.has(String(t.parentTaskId))) return;  // 稍後跟著主任務一起排
    f.push(t);
    if(!t.parentTaskId) f0.filter(k=>String(k.parentTaskId)===String(t.id)).forEach(k=>f.push(k));
  });
  b.innerHTML=f.map(t=>{
    const done=t.status==='完成'||t.status==='取消/終止',hc=histOf(t.id).length,id=jsAttr(t.id),tt=jsAttr(t.title);
    const statusSel=`<select class="sel" onchange="inlineUpdate('${id}','status',this.value)">
      ${['待處理','進行中','完成','取消/終止'].map(s=>`<option${t.status===s?' selected':''}>${s}</option>`).join('')}</select>`;
    const nKids=kidsOf(t.id).length;
    return `<div class="trow ${done?'done':''} ${t.parentTaskId?'is-sub':''}">
      <div class="cell cell-title"><span class="cell-label">任務</span>
        <input class="inp t-title-input" value="${esc(t.title)}" onchange="inlineUpdateDeb('${id}','title',this.value)">
        ${hierChip(t, nKids)}</div>

      <div class="cell"><span class="cell-label">專案</span>${t.category?`<span class="badge b-cat">${esc(t.category)}</span>`:'<span style="color:var(--muted)">—</span>'}</div>
      <div class="cell"><span class="cell-label">負責人</span><span class="person">${avatar(t.member)}<input class="inp" list="dl-people" value="${esc(t.member)}" placeholder="—" onchange="inlineUpdateDeb('${id}','member',this.value)"></span></div>
      <div class="cell"><span class="cell-label">協助者</span><span class="persons exec-cell" title="點一下編輯協助者" onclick="openExecPicker('${id}')">${
        people2arr(t.executor).length
          ? people2arr(t.executor).map(n=>`<span class="person">${avatar(n)}<span>${esc(n)}</span></span>`).join('')
          : '<span style="color:var(--muted)">＋ 指派</span>'}</span></div>
      <div class="cell"><span class="cell-label">優先</span>${priSelect(t)}</div>
      <div class="cell"><span class="cell-label">狀態</span>${statusSel}</div>
      <div class="cell"><span class="cell-label">截止</span><input class="inp" type="date" value="${toISO(t.due)}" onchange="inlineUpdate('${id}','due',this.value)"></div>
      <div class="cell"><span class="cell-label">備註</span><input class="inp" value="${esc(t.note)}" placeholder="點此編輯…" onchange="inlineUpdateDeb('${id}','note',this.value)"></div>
      <div class="cell"><span class="cell-label">歷史</span><button class="hist-btn" onclick="openHistory('${id}','${tt}')">${hc>0?`記錄(${hc})`:'+ 記錄'}</button></div>
      <div class="cell" style="justify-content:flex-end"><button class="x-btn" onclick="askDelete('${id}','${tt}','task')" title="刪除">✕</button></div>
    </div>`;
  }).join('');
}

/* ===== MEETINGS ===== */
/* ===== MEMBERS / LINE ===== */
function renderMembers(){
  const bound=members.filter(m=>m.userId).length;
  document.getElementById('bind-hint').innerHTML=`<b>綁定方式：</b>① 在這裡新增成員姓名 → ② 請他加 LINE 官方帳號好友 → ③ 在對話框輸入<b>自己的姓名</b>，系統會自動把 LINE 綁上。目前已綁定 <b>${bound}/${members.length}</b> 人。`;
  const el=document.getElementById('members-body');
  if(!members.length){el.innerHTML='<div class="empty">尚無成員，點右上角新增</div>';return;}
  el.innerHTML=members.map(m=>{
    const on=m.notify==='TRUE'||m.notify===true||m.notify===undefined||m.notify==='';
    const linked=!!m.userId,id=jsAttr(m.id);
    return `<div class="card" style="display:flex;align-items:center;gap:12px">
      ${avatar(m.name)}
      <div style="flex:1;min-width:0">
        <div style="font-weight:700">${esc(m.name)}</div>
        <div style="font-size:12px;margin-top:2px;color:${linked?'var(--green)':'var(--muted)'}">${linked?'✓ 已綁定 LINE':'尚未綁定 LINE'}</div>
      </div>
      <label class="switch" title="接收任務通知"><input type="checkbox" ${on?'checked':''} onchange="updMember('${id}','notify',this.checked?'TRUE':'FALSE')"><span class="slider"></span></label>
      <button class="x-btn" onclick="askDelete('${id}','${jsAttr(m.name)}','member')">✕</button>
    </div>`;
  }).join('');
}
async function addMember(){
  const name=document.getElementById('mb-name').value.trim();
  if(!name){showToast('請填姓名');return;}
  const btn=document.getElementById('btn-member');btn.disabled=true;btn.textContent='新增中…';
  try{await apiPost({action:'addMember',row:{name,notify:'TRUE'}});closeModal('member');document.getElementById('mb-name').value='';showToast('已新增');await loadData();}catch(e){showToast('新增失敗');}
  btn.disabled=false;btn.textContent='新增';
}
async function updMember(id,field,value){try{const m=members.find(x=>String(x.id)===String(id));if(m)m[field]=value;await apiPost({action:'updateMember',id,row:{[field]:value}});showToast('已更新');}catch(e){showToast('更新失敗');}}

/* ===== add task ===== */
/* 新增任務後，把 LINE 通知的結果講清楚——
   之前不管有沒有推成功都只顯示「任務已新增」，所以沒收到也不會有人發現 */
function notifyMsg(rsp){
  const n = rsp && rsp.notify;
  if(!n) return '任務已新增';
  if(n.ok === false) return '任務已新增，但 LINE 沒送出：' + (n.reason||'原因不明');
  const sent = n.sent||[], skip = n.skipped||[];
  if(!sent.length && !skip.length) return '任務已新增' + (n.note ? '（'+n.note+'）' : '');
  let m = '任務已新增';
  if(sent.length) m += '，已通知 ' + sent.join('、');
  if(skip.length) m += '｜未通知：' + skip.map(x=>x.name+'（'+x.why+'）').join('、');
  return m;
}
async function addTask(){
  const title=document.getElementById('t-title').value.trim();
  if(!title){showToast('請填任務名稱');return;}
  const btn=document.getElementById('btn-task');btn.disabled=true;btn.textContent='儲存中…';
  try{
    const rsp = await apiPost({action:'addTask',notify:document.getElementById('t-notify').checked,row:{
      title,category:document.getElementById('t-category').value.trim(),
      member:document.getElementById('t-member').value.trim(),
      executor:arr2people(people2arr(document.getElementById('t-executor').value)),
      priority:document.getElementById('t-priority').value,due:document.getElementById('t-due').value,
      status:document.getElementById('t-status').value,note:document.getElementById('t-note').value.trim(),
      parentTaskId:document.getElementById('t-parent').value||null,
      isParent:document.getElementById('t-isparent').checked
    }});
    closeModal('task');['t-title','t-category','t-member','t-executor','t-note','t-due','t-parent'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('t-isparent').checked=false;
    document.querySelectorAll('#t-exec-chips .chip').forEach(el=>el.classList.remove('on'));
    document.getElementById('t-notify').checked=true;
    showToast(notifyMsg(rsp));await loadData();
  }catch(e){
    showToast('沒收到回應，請按「↻ 重新整理」確認是否已新增，再決定要不要重送');
    await loadData();            // 順便重載，多半會發現其實已經寫進去了
  }
  btn.disabled=false;btn.textContent='新增';
}
/* ===== inline / history / delete ===== */
async function inlineUpdate(id,field,value){try{const t=tasks.find(x=>String(x.id)===String(id));if(t){t[field]=value;updateStats();}await apiPost({action:'updateTask',id,row:{[field]:value}});showToast('已儲存');renderCurrent();}catch(e){showToast('儲存失敗');}}
function inlineUpdateDeb(id,field,value){if(saveTimer[id+field])clearTimeout(saveTimer[id+field]);saveTimer[id+field]=setTimeout(()=>inlineUpdate(id,field,value),700);}

function openHistory(id,title){
  curHistoryId=id;document.getElementById('history-title').textContent='修改記錄：'+title;
  const hs=histOf(id),b=document.getElementById('history-body');
  b.innerHTML=hs.length?hs.map(h=>`<div class="history-item"><div class="d">${fmtDate(h.date)}</div><div>${esc(h.change)}</div></div>`).join(''):'<div class="empty" style="padding:14px 0">尚無修改記錄</div>';
  document.getElementById('history-input').value='';openModal('history');
}
async function submitHistory(){
  const change=document.getElementById('history-input').value.trim();if(!change){showToast('請填修改說明');return;}
  const btn=document.getElementById('btn-history');btn.disabled=true;btn.textContent='儲存中…';
  try{await apiPost({action:'addHistory',taskId:curHistoryId,change});showToast('已新增');await loadData();
    openHistory(curHistoryId,document.getElementById('history-title').textContent.replace('修改記錄：',''));}catch(e){showToast('儲存失敗');}
  btn.disabled=false;btn.textContent='新增記錄';
}

function askDelete(id,title,type){pendingDelete={id,type};document.getElementById('confirm-title').textContent=title;openModal('confirm');}
async function confirmDelete(){
  if(!pendingDelete)return;const{id,type}=pendingDelete;
  const actionMap={task:'deleteTask',target:'deleteTask',member:'deleteMember'};
  try{await apiPost({action:actionMap[type]||'deleteTask',id});
    if(type==='task')tasks=tasks.filter(t=>String(t.id)!==String(id));
    if(type==='member')members=members.filter(t=>String(t.id)!==String(id));
    pendingDelete=null;closeModal('confirm');showToast('已刪除');updateStats();renderCurrent();}catch(e){showToast('刪除失敗');}
}

function drawExecChips(people){
  drawChipsInto('t-exec-chips','t-executor',people);
  drawChipsInto('e-exec-chips','e-executor',people);
}
/* 名字按鈕：新增任務和編輯協助者兩個視窗共用同一套 */
function drawChipsInto(boxId,inputId,people){
  const box=document.getElementById(boxId), inp=document.getElementById(inputId);
  if(!box||!inp) return;
  const cur=people2arr(inp.value);
  box.innerHTML=people.map(n=>
    `<span class="chip${cur.includes(n)?' on':''}" data-p="${esc(n)}">${esc(n)}</span>`).join('');
  box.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{
    const list=people2arr(inp.value), n=el.dataset.p;
    inp.value=arr2people(list.includes(n)?list.filter(x=>x!==n):[...list,n]);
    drawChipsInto(boxId,inputId,people);
  });
}
/* 目前可指派的人：成員名冊 ＋ 既有任務上出現過的名字 */
function allPeople(){
  return [...new Set([
    ...tasks.map(t=>t.member),
    ...tasks.flatMap(t=>people2arr(t.executor)),
    ...members.map(m=>m.name)
  ].filter(Boolean))];
}
let curExecId=null;
function openExecPicker(id){
  const t=tasks.find(x=>String(x.id)===String(id)); if(!t) return;
  curExecId=id;
  document.getElementById('exec-task-name').textContent=t.title||'';
  document.getElementById('e-executor').value=t.executor||'';
  drawChipsInto('e-exec-chips','e-executor',allPeople());
  openModal('exec');
}
async function saveExec(){
  if(!curExecId) return;
  const v=arr2people(people2arr(document.getElementById('e-executor').value));
  closeModal('exec');
  await inlineUpdate(curExecId,'executor',v);
  curExecId=null;
}
// 手動打字時，名字按鈕的亮暗跟著更新（只重畫按鈕，不動整個畫面）
document.addEventListener('input',e=>{
  const map={'t-executor':'t-exec-chips','e-executor':'e-exec-chips'};
  const box=e.target && map[e.target.id];
  if(box){
    const cur=people2arr(e.target.value);
    document.querySelectorAll('#'+box+' [data-p]')
      .forEach(el=>el.classList.toggle('on', cur.includes(el.dataset.p)));
  }
});

function openModal(t){
  // 開新增任務視窗時重新產生上層任務清單，剛建的主任務才選得到
  if(t==='task') fillParentPicker();
  document.getElementById('modal-'+t).classList.add('open');
}
function closeModal(t){document.getElementById('modal-'+t).classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('open');}));

/* PWA */
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}

loadData();
</script>
